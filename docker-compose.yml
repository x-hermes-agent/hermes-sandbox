services:
  hermes:
    image: nousresearch/hermes-agent:v0.22.5
    volumes:
      - hermes_data:/opt/data
      - hermes_to_sandbox:/home/agent/hermes-to-sandbox
      - sandbox_to_hermes:/home/agent/sandbox-to-hermes:ro
    env_file:
      - path: .env
        required: false
    environment:
      HERMES_WRITE_SAFE_ROOT: /home/agent
    command: ["gateway", "run"]
    restart: unless-stopped

  hermes-sandbox:
    build: .
    image: hermes-sandbox:local
    volumes:
      - hermes_to_sandbox:/home/agent/hermes-to-sandbox:ro
      - sandbox_home:/home/agent
      - sandbox_nix:/nix
      - sandbox_ssh_keys:/etc/ssh/keys
      - sandbox_to_hermes:/home/agent/sandbox-to-hermes
    environment:
      AUTHORIZED_KEY: ${SANDBOX_AUTHORIZED_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "sshd"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          pids: 1024

volumes:
  hermes_data:
  hermes_to_sandbox:
  sandbox_home:
  sandbox_nix:
  sandbox_ssh_keys:
  sandbox_to_hermes:
